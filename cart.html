<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cart - V~Leaf</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  background:#fff;
  color:#000;
}

/* NAVBAR */

nav{
  padding:18px 40px;
  border-bottom:1px solid #eee;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  background:rgba(255,255,255,0.9);
  backdrop-filter:blur(10px);
  z-index:100;
}

nav strong{
  font-size:22px;
}

/* CONTAINER */

.container{
  padding:40px 10%;
}

/* CART ITEM */

.item{
  display:flex;
  align-items:center;
  gap:15px;
  padding:20px;
  margin-bottom:15px;
  border-radius:25px;
  background:#fafafa;
  transition:0.3s;
}

.item:hover{
  transform:translateY(-3px);
  box-shadow:0 10px 25px rgba(0,0,0,0.05);
}

.item img{
  width:90px;
  height:90px;
  object-fit:cover;
  border-radius:20px;
}

.info{
  flex:1;
}

.info h4{
  margin:0;
  font-size:18px;
}

.info p{
  margin:5px 0;
  color:#666;
}

/* ACTIONS */

.actions{
  display:flex;
  align-items:center;
  gap:10px;
}

.actions input{
  width:70px;
  padding:10px;
  border-radius:12px;
  border:1px solid #ddd;
}

/* BUTTONS */

button{
  border:none;
  cursor:pointer;
  transition:0.3s;
}

.checkout-btn{
  margin-top:25px;
  padding:16px 30px;
  border-radius:50px;
  background:#39FF14;
  color:black;
  font-weight:bold;
  font-size:16px;
}

.checkout-btn:hover{
  transform:scale(1.03);
}

.remove{
  width:35px;
  height:35px;
  border-radius:50%;
  background:black;
  color:white;
  font-weight:bold;
}

/* TOTAL */

.total{
  margin-top:20px;
  font-size:22px;
  font-weight:bold;
}

/* MODAL */

.modal{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.5);
  display:none;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.modal-box{
  background:white;
  width:100%;
  max-width:400px;
  border-radius:25px;
  padding:25px;
  animation:fade .3s ease;
}

@keyframes fade{
  from{
    opacity:0;
    transform:translateY(20px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.modal-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.modal-top h3{
  margin:0;
}

.close{
  cursor:pointer;
  font-size:22px;
}

/* INPUTS */

.modal input{
  width:100%;
  padding:14px;
  margin-bottom:12px;
  border-radius:15px;
  border:1px solid #ddd;
  outline:none;
}

.modal input:focus{
  border-color:#39FF14;
}

/* CHECKBOX */

.checkbox{
  width:18px;
  height:18px;
}

/* LOADING */

.loading{
  text-align:center;
  padding:50px;
  color:#777;
}

.empty{
  text-align:center;
  padding:50px;
  color:#999;
}

</style>
</head>

<body>

<nav>
  <strong>V~Leaf Cart</strong>
</nav>

<div class="container">

  <div id="cart" class="loading">
    Loading cart...
  </div>

  <div class="total" id="total"></div>

  <button class="checkout-btn" onclick="openCheckout()">
    Checkout
  </button>

</div>

<!-- MODAL -->

<div class="modal" id="modal">

  <div class="modal-box">

    <div class="modal-top">
      <h3>Checkout</h3>
      <span class="close" onclick="closeModal()">✕</span>
    </div>

    <input id="name" placeholder="Full name">

    <input id="phone" placeholder="Phone number">

    <input id="address" placeholder="Shipping address">

    <button
      id="confirmBtn"
      class="checkout-btn"
      style="width:100%;"
      onclick="confirmCheckout()"
    >
      Confirm Order
    </button>

  </div>

</div>

<script type="module">

import { supabase } from "./supabase.js"

let cartItems = []
let selectedItems = []
let processing = false

/* LOAD CART */

async function loadCart(){

  try{

    const { data: userData } =
      await supabase.auth.getUser()

    if(!userData.user){

      document.getElementById("cart").innerHTML =
        `<div class="empty">Login required</div>`

      return
    }

    const user = userData.user

    const { data, error } = await supabase
      .from("cart")
      .select(`
        *,
        products(*)
      `)
      .eq("user_id", user.id)

    if(error){

      document.getElementById("cart").innerHTML =
        `<div class="empty">Error loading cart</div>`

      return
    }

    cartItems = data || []

    if(cartItems.length === 0){

      document.getElementById("cart").innerHTML =
        `<div class="empty">Your cart is empty</div>`

      document.getElementById("total").innerText = ""

      return
    }

    let html = ""
    let total = 0

    for(let item of cartItems){

      const product = item.products

      /* PRODUCT REMOVED */

      if(!product){

        await supabase
          .from("cart")
          .delete()
          .eq("id", item.id)

        continue
      }

      const price =
        Number(product.price) || 0

      const quantity =
        Number(item.quantity) || 1

      total += price * quantity

      html += `
        <div class="item">

          <input
            class="checkbox"
            type="checkbox"
            onchange="toggleItem('${item.id}')"
          >

          <img src="${product.image || ''}">

          <div class="info">

            <h4>${product.name}</h4>

            <p>$${price}</p>

            <p>
              Size:
              ${item.size || "-"}
            </p>

          </div>

          <div class="actions">

            <input
              type="number"
              min="1"
              value="${quantity}"
              onchange="
                updateQty(
                  '${item.id}',
                  this.value
                )
              "
            >

            <button
              class="remove"
              onclick="removeItem('${item.id}')"
            >
              ✕
            </button>

          </div>

        </div>
      `
    }

    document.getElementById("cart").innerHTML =
      html

    document.getElementById("total").innerText =
      "Cart Total: $" + total.toFixed(2)

  }catch(err){

    console.error(err)

    document.getElementById("cart").innerHTML =
      `<div class="empty">Unexpected error</div>`
  }
}

/* UPDATE QUANTITY */

window.updateQty = async function(id, qty){

  qty = Number(qty)

  if(isNaN(qty) || qty < 1){

    return alert("Invalid quantity")
  }

  await supabase
    .from("cart")
    .update({
      quantity: qty
    })
    .eq("id", id)

  loadCart()
}

/* TOGGLE ITEMS */

window.toggleItem = function(id){

  if(selectedItems.includes(id)){

    selectedItems =
      selectedItems.filter(i => i !== id)

  }else{

    selectedItems.push(id)
  }
}

/* REMOVE ITEM */

window.removeItem = async function(id){

  await supabase
    .from("cart")
    .delete()
    .eq("id", id)

  loadCart()
}

/* OPEN CHECKOUT */

window.openCheckout = async function(){

  if(cartItems.length === 0){

    return alert("Cart empty")
  }

  const { data: userData } =
    await supabase.auth.getUser()

  const user = userData.user

  const { data: profile } = await supabase
    .from("profiles")
    .select("*")
    .eq("id", user.id)
    .single()

  document.getElementById("name").value =
    profile?.full_name || ""

  document.getElementById("phone").value =
    profile?.phone || ""

  document.getElementById("address").value =
    profile?.address || ""

  document.getElementById("modal").style.display =
    "flex"
}

/* CLOSE MODAL */

window.closeModal = function(){

  document.getElementById("modal").style.display =
    "none"
}

/* STRIPE CHECKOUT */

window.confirmCheckout = async function(){

  try{

    if(processing) return

    processing = true

    const btn =
      document.getElementById("confirmBtn")

    btn.innerText = "Redirecting..."

    const name =
      document.getElementById("name").value.trim()

    const phone =
      document.getElementById("phone").value.trim()

    const address =
      document.getElementById("address").value.trim()

    if(!name || !phone || !address){

      alert("Please fill all fields")

      processing = false

      btn.innerText =
        "Confirm Order"

      return
    }

    const { data: userData } =
      await supabase.auth.getUser()

    const user = userData.user

    let itemsToBuy = selectedItems.length
      ? cartItems.filter(i =>
          selectedItems.includes(i.id)
        )
      : cartItems

    if(itemsToBuy.length === 0){

      alert("No items selected")

      processing = false

      btn.innerText =
        "Confirm Order"

      return
    }

    const formattedItems =
      itemsToBuy.map(item => ({

        product_id:
          item.product_id,

        name:
          item.products.name,

        image:
          item.products.image,

        price:
          Number(item.products.price),

        quantity:
          Number(item.quantity),

        size:
          item.size || ""

      }))

    const response = await fetch(
      "https://ztqorvunrwztxfcawmik.supabase.co/functions/v1/create-checkout",
      {
        method: "POST",

        headers: {
          "Content-Type":
            "application/json"
        },

        body: JSON.stringify({

          user_id:
            user.id,

          customer: {
            name,
            phone,
            address
          },

          items:
            formattedItems
        })
      }
    )

    const data =
      await response.json()

    console.log(data)

    if(data.url){

      window.location.href =
        data.url

    }else{

      console.error(data)

      alert(
        data.error ||
        "Stripe checkout failed"
      )

      processing = false

      btn.innerText =
        "Confirm Order"
    }

  }catch(err){

    console.error(err)

    alert("Checkout error")

    processing = false

    document.getElementById("confirmBtn").innerText =
      "Confirm Order"
  }
}

loadCart()

</script>
</body>
</html>
