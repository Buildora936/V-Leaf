<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Payment Success - V~Leaf</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  background:black;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  overflow-x:hidden;
}

/* BACKGROUND */

.bg{

  position:fixed;
  inset:0;

  background:
  radial-gradient(
    circle at top,
    #39FF14 0%,
    transparent 35%
  );

  opacity:0.15;
}

/* CARD */

.card{

  position:relative;

  width:90%;
  max-width:650px;

  background:
  rgba(255,255,255,0.05);

  border:
  1px solid rgba(255,255,255,0.08);

  backdrop-filter:blur(20px);

  border-radius:35px;

  padding:50px 35px;

  text-align:center;

  z-index:10;

  animation:fade 0.8s ease;
}

@keyframes fade{

  from{
    opacity:0;
    transform:translateY(40px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* CHECK ICON */

.check{

  width:110px;
  height:110px;

  margin:auto;
  margin-bottom:25px;

  border-radius:50%;

  background:#39FF14;

  display:flex;
  justify-content:center;
  align-items:center;

  color:black;

  font-size:55px;
  font-weight:bold;

  animation:pulse 2s infinite;
}

@keyframes pulse{

  0%{
    transform:scale(1);
  }

  50%{
    transform:scale(1.05);
  }

  100%{
    transform:scale(1);
  }
}

h1{
  margin:0;
  font-size:42px;
}

p{

  color:#bbb;

  line-height:1.7;

  margin-top:15px;
}

/* ORDER BOX */

.order-box{

  margin-top:35px;

  background:
  rgba(255,255,255,0.04);

  border:
  1px solid rgba(255,255,255,0.08);

  border-radius:25px;

  padding:25px;

  text-align:left;
}

.order-row{

  display:flex;
  justify-content:space-between;

  gap:20px;

  margin-bottom:15px;

  flex-wrap:wrap;
}

.label{
  color:#777;
  font-size:14px;
}

.value{
  font-weight:bold;
  margin-top:5px;
}

/* PRODUCTS */

.products{

  margin-top:30px;
}

.product{

  display:flex;
  align-items:center;

  gap:15px;

  background:
  rgba(255,255,255,0.04);

  border:
  1px solid rgba(255,255,255,0.06);

  padding:15px;

  border-radius:20px;

  margin-bottom:15px;
}

.product img{

  width:70px;
  height:70px;

  object-fit:cover;

  border-radius:15px;
}

.product-info{
  flex:1;
  text-align:left;
}

.product-info h4{
  margin:0;
}

.product-info p{
  margin:5px 0 0;
  font-size:14px;
}

/* BUTTONS */

.buttons{

  display:flex;
  gap:15px;

  margin-top:35px;

  justify-content:center;

  flex-wrap:wrap;
}

.btn{

  padding:16px 28px;

  border:none;

  border-radius:50px;

  cursor:pointer;

  font-weight:bold;

  font-size:15px;

  transition:0.3s;
}

.btn:hover{
  transform:translateY(-3px);
}

.primary{

  background:#39FF14;
  color:black;
}

.secondary{

  background:white;
  color:black;
}

/* SMALL */

.small{

  margin-top:25px;

  color:#777;

  font-size:13px;
}

/* LOADING */

.loading{
  color:#999;
  margin-top:30px;
}

</style>

</head>

<body>

<div class="bg"></div>

<div class="card">

  <div class="check">
    ✓
  </div>

  <h1>Payment Successful</h1>

  <p>

    Your V~Leaf order has been confirmed.

    Our team is preparing your products
    for shipping.

  </p>

  <div id="content">

    <div class="loading">
      Loading order...
    </div>

  </div>

  <div class="small">

    V~Leaf Premium Experience

  </div>

</div>

<script type="module">

import { supabase } from "./supabase.js"

const sessionId =
  new URLSearchParams(
    window.location.search
  ).get("session_id")

async function loadOrder(){

  try{

    if(!sessionId){

      document.getElementById("content").innerHTML =
        `<p>Missing session id</p>`

      return
    }

    /* GET ORDER */

    const { data: order, error } =
      await supabase
        .from("orders")
        .select("*")
        .eq(
          "stripe_session_id",
          sessionId
        )
        .single()

    if(error || !order){

      document.getElementById("content").innerHTML =
        `<p>Order not found</p>`

      return
    }

    /* GET ITEMS */

    const { data: items } =
      await supabase
        .from("order_items")
        .select(`
          *,
          products(*)
        `)
        .eq("order_id", order.id)

    let productsHTML = ""

    for(let item of items){

      const product = item.products

      if(!product) continue

      productsHTML += `

        <div class="product">

          <img
            src="${product.image || ''}"
          >

          <div class="product-info">

            <h4>
              ${product.name}
            </h4>

            <p>
              Size:
              ${item.size || "-"}
            </p>

            <p>
              Qty:
              ${item.quantity}
            </p>

            <p>
              $${item.price}
            </p>

          </div>

        </div>
      `
    }

    /* RENDER */

    document.getElementById("content").innerHTML =
    `

      <div class="order-box">

        <div class="order-row">

          <div>

            <div class="label">
              Order ID
            </div>

            <div class="value">
              ${order.id}
            </div>

          </div>

          <div>

            <div class="label">
              Status
            </div>

            <div class="value">
              ${order.status}
            </div>

          </div>

        </div>

        <div class="order-row">

          <div>

            <div class="label">
              Total
            </div>

            <div class="value">
              $${order.total}
            </div>

          </div>

          <div>

            <div class="label">
              Date
            </div>

            <div class="value">
              ${new Date(
                order.created_at
              ).toLocaleDateString()}
            </div>

          </div>

        </div>

        <div class="order-row">

          <div>

            <div class="label">
              Shipping Address
            </div>

            <div class="value">
              ${order.address}
            </div>

          </div>

        </div>

      </div>

      <div class="products">

        ${productsHTML}

      </div>

      <div class="buttons">

        <button
          class="btn primary"
          onclick="
          window.location.href=
          'tracking.html?id=${order.id}'
          "
        >
          Track Order
        </button>

        <button
          class="btn secondary"
          onclick="
          window.location.href=
          'shop.html'
          "
        >
          Continue Shopping
        </button>

      </div>
    `

  }catch(err){

    console.error(err)

    document.getElementById("content").innerHTML =
      `<p>Unexpected error</p>`
  }
}

loadOrder()

</script>

</body>
</html>
