<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tracking - V~Leaf</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:sans-serif;
  background:white;
}

/* HEADER */

\.header{
  height:70px;
  background:white;
  border-bottom:1px solid #eee;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 30px;

  position:sticky;
  top:0;
  z-index:100;
}

.left{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo{
  width:38px;
  height:38px;
  object-fit:contain;
}

.back{
  font-size:22px;
  cursor:pointer;
  margin-right:5px;
}
.logo{
  color:#39FF14;
}

/* CONTAINER */

.container{
  max-width:900px;
  margin:auto;
  padding:20px;
}

/* CARD */

.card{
  background:#181818;
  border:1px solid #222;
  border-radius:25px;
  padding:25px;
  margin-bottom:20px;
}

/* ORDER HEADER */

.order-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  flex-wrap:wrap;
}

.order-id{
  font-size:22px;
  font-weight:bold;
}

.order-date{
  color:#999;
  margin-top:5px;
}

/* STATUS */

.status{
  padding:10px 18px;
  border-radius:30px;
  font-size:13px;
  font-weight:bold;
  text-transform:uppercase;
}

.pending{
  background:#ffb703;
  color:black;
}

.paid{
  background:#39FF14;
  color:black;
}

.processing{
  background:#00b4d8;
}

.manufacturing{
  background:#8338ec;
}

.shipped{
  background:#222;
}

.out_for_delivery{
  background:#3a86ff;
}

.delivered{
  background:#39FF14;
  color:black;
}

.cancelled{
  background:#ef233c;
}

/* PROGRESS */

.progress-wrap{
  margin-top:30px;
}

.progress-bar{
  width:100%;
  height:12px;
  background:#222;
  border-radius:20px;
  overflow:hidden;
}

.progress{
  height:100%;
  background:#39FF14;
  border-radius:20px;
  transition:0.5s;
}

/* TIMELINE */

.timeline{
  margin-top:40px;
  position:relative;
  padding-left:35px;
}

.line{
  position:absolute;
  left:8px;
  top:0;
  bottom:0;
  width:3px;
  background:#222;
}

.step{
  position:relative;
  margin-bottom:30px;
}

.dot{
  width:18px;
  height:18px;
  border-radius:50%;
  background:#333;
  position:absolute;
  left:-35px;
  top:2px;
}

.step.done .dot{
  background:#39FF14;
}

.step.active .dot{
  background:#39FF14;
  box-shadow:0 0 15px #39FF14;
  animation:pulse 1.5s infinite;
}

@keyframes pulse{
  0%{transform:scale(1);}
  50%{transform:scale(1.2);}
  100%{transform:scale(1);}
}

.step-title{
  font-weight:bold;
  margin-bottom:5px;
}

.step-desc{
  color:#999;
  font-size:14px;
}

/* PRODUCTS */

.products{
  margin-top:30px;
}

.product{
  display:flex;
  gap:15px;
  align-items:center;
  background:#111;
  border-radius:20px;
  padding:15px;
  margin-bottom:15px;
}

.product img{
  width:80px;
  height:80px;
  object-fit:cover;
  border-radius:15px;
}

.product-info{
  flex:1;
}

.product-name{
  font-weight:bold;
  margin-bottom:5px;
}

.product-meta{
  color:#999;
  font-size:14px;
}

/* SHIPPING */

.shipping{
  margin-top:30px;
  display:grid;
  gap:10px;
}

.shipping-box{
  background:#111;
  border-radius:20px;
  padding:18px;
}

.shipping-title{
  color:#39FF14;
  margin-bottom:10px;
  font-weight:bold;
}

/* EMPTY */

.empty{
  text-align:center;
  padding:60px 20px;
}

.empty h2{
  margin-bottom:10px;
}

.empty p{
  color:#999;
  margin-bottom:25px;
}

.shop-btn{
  display:inline-block;
  padding:14px 24px;
  border-radius:30px;
  background:#39FF14;
  color:black;
  text-decoration:none;
  font-weight:bold;
}

</style>
</head>

<body>

<header class="header">

  <div class="left">

    <nav>
  <div class="left-nav" onclick="goBack()">
    <i class="fa-solid fa-arrow-left"></i>
  </div>

  <div class="right-nav">
    <a href="cart.html"><i class="fa-solid fa-cart-shopping"></i></a>
    <img src="https://via.placeholder.com/40" id="avatar" class="avatar">
  </div>
</nav>

    <img
      src="V-Leaf logo.png"
      class="logo"
    >

    <strong>V~Leaf</strong>

  </div>

</header>
  

<div class="container">
  <div id="tracking">
    Loading...
  </div>
</div>

<script type="module">

import { supabase }
from "./supabase.js"

const orderId =
  new URLSearchParams(
    window.location.search
  ).get("id")

/* LOAD TRACKING */

async function loadTracking(){

  const { data:userData } =
    await supabase.auth.getUser()

  if(!userData.user){

    location.href = "login.html"
    return
  }

  const user =
    userData.user

  const { data:order } =
    await supabase
      .from("orders")
      .select("*")
      .eq("id", orderId)
      .eq("user_id", user.id)
      .single()

  if(!order){

    document.getElementById("tracking")
    .innerHTML = `
      <div class="empty">
        <h2>Order not found</h2>
        <p>
          This order does not exist
          or you don't have access.
        </p>

        <a
          href="shop.html"
          class="shop-btn"
        >
          Continue Shopping
        </a>
      </div>
    `
    return
  }

  const { data:items } =
    await supabase
      .from("order_items")
      .select(`
        *,
        products(*)
      `)
      .eq("order_id", order.id)

  render(order, items || [])
}

/* STATUS FLOW */

const statusFlow = [

  "pending",

  "paid",

  "processing",

  "manufacturing",

  "shipped",

  "out_for_delivery",

  "delivered"
]

function getProgress(status){

  const index =
    statusFlow.indexOf(status)

  if(index < 0) return 0

  return (
    (
      index + 1
    )
    /
    statusFlow.length
  ) * 100
}

function getSteps(status){

  const steps = [

    {
      key:"pending",
      title:"Order placed",
      desc:"Your order was created"
    },

    {
      key:"paid",
      title:"Payment confirmed",
      desc:"Payment received successfully"
    },

    {
      key:"processing",
      title:"Processing",
      desc:"Preparing your order"
    },

    {
      key:"manufacturing",
      title:"Manufacturing",
      desc:"Your products are being made"
    },

    {
      key:"shipped",
      title:"Shipped",
      desc:"Package shipped"
    },

    {
      key:"out_for_delivery",
      title:"Out for delivery",
      desc:"Carrier is delivering package"
    },

    {
      key:"delivered",
      title:"Delivered",
      desc:"Package delivered"
    }
  ]

  const current =
    steps.findIndex(
      s => s.key === status
    )

  return steps.map((s, index) => ({

    ...s,

    done:
      index < current,

    active:
      s.key === status
  }))
}

/* RENDER */

function render(order, items){

  const progress =
    getProgress(order.status)

  const steps =
    getSteps(order.status)

  let html = `

    <div class="card">

      <div class="order-top">

        <div>

          <div class="order-id">
            Order #${order.id}
          </div>

          <div class="order-date">
            ${new Date(
              order.created_at
            ).toLocaleString()}
          </div>

        </div>

        <div class="
          status
          ${order.status}
        ">
          ${order.status.replaceAll(
            "_",
            " "
          )}
        </div>

      </div>

      <div class="progress-wrap">

        <div class="progress-bar">
          <div
            class="progress"
            style="
              width:${progress}%
            "
          ></div>
        </div>

      </div>

      <div class="timeline">

        <div class="line"></div>
  `

  steps.forEach(step => {

    html += `
      <div class="
        step
        ${step.done ? "done" : ""}
        ${step.active ? "active" : ""}
      ">

        <div class="dot"></div>

        <div class="step-title">
          ${step.title}
        </div>

        <div class="step-desc">
          ${step.desc}
        </div>

      </div>
    `
  })

  html += `
      </div>

      <div class="products">
  `

  items.forEach(item => {

    const product =
      item.products

    if(!product) return

    html += `
      <div class="product">

        <img src="
          ${product.image || ""}
        ">

        <div class="product-info">

          <div class="product-name">
            ${product.name}
          </div>

          <div class="product-meta">
            Size:
            ${item.size || "-"}
          </div>

          <div class="product-meta">
            Qty:
            ${item.quantity}
          </div>

          <div class="product-meta">
            $${item.price}
          </div>

        </div>

      </div>
    `
  })

  html += `
      </div>

      <div class="shipping">

        <div class="shipping-box">

          <div class="shipping-title">
            Shipping Address
          </div>

          <div>
            ${order.name}
          </div>

          <div>
            ${order.phone}
          </div>

          <div>
            ${order.address}
          </div>

        </div>

        <div class="shipping-box">

          <div class="shipping-title">
            Delivery Info
          </div>

          <div>
            Carrier:
            ${order.carrier || "-"}
          </div>

          <div>
            Tracking:
            ${order.tracking_number || "-"}
          </div>

          <div>
            Estimated Delivery:
            ${
              order.estimated_delivery
              ?
              new Date(
                order.estimated_delivery
              ).toLocaleDateString()
              :
              "-"
            }
          </div>

        </div>

      </div>

    </div>
  `

  document.getElementById("tracking")
  .innerHTML = html
}

/* REALTIME */

supabase
  .channel("tracking-live")
  .on(
    "postgres_changes",
    {
      event:"UPDATE",
      schema:"public",
      table:"orders",
      filter:`id=eq.${orderId}`
    },
    () => {
      loadTracking()
    }
  )
  .subscribe()

/* FALLBACK REFRESH */

setInterval(
  loadTracking,
  15000
)

loadTracking()

</script>

</body>
</html>
